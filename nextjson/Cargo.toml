[package]
name = "nextjson"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords = ["json", "serialization", "deserialization", "serde", "parser"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "../README.md"

[features]
default = ["std", "derive"]
std = []
derive = ["dep:nextjson-derive"]
serde = ["dep:serde"]
transcode = ["std", "serde", "dep:serde-transcode"]

[dependencies]
itoa = "1.0"
memchr = { version = "2.7", default-features = false }
nextjson-derive = { workspace = true, optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
serde-transcode = { version = "1.1.1", optional = true }
zmij = "1.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

[[bench]]
name = "serde_comparison"
harness = false
required-features = ["serde"]
