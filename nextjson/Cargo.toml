[package]
name = "nextjson"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nextjson"
description.workspace = true
keywords = ["json", "cbor", "serialization", "deserialization", "parser"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "../README.md"

[features]
default = ["derive"]
derive = ["dep:nextjson-derive"]
simd = []

[dependencies]
nextjson-derive = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "format_comparison"
harness = false

[[bench]]
name = "resource_paths"
harness = false

[[example]]
name = "contract_engine"
crate-type = ["lib"]
required-features = ["derive"]
test = true

[[example]]
name = "cross_format_relay"
crate-type = ["lib"]
required-features = ["derive"]
test = true

[[example]]
name = "custom_codec"
crate-type = ["lib"]
required-features = ["derive"]
test = true

[[example]]
name = "multi_format"
crate-type = ["lib"]
required-features = ["derive"]
test = true

[[example]]
name = "streaming_reader"
crate-type = ["lib"]
required-features = ["derive"]
test = true

[[example]]
name = "zero_copy_reuse"
crate-type = ["lib"]
required-features = ["derive"]
test = true
