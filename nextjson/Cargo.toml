[package]
name = "nextjson"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nextjson"
description.workspace = true
keywords = ["json", "cbor", "serialization", "deserialization", "parser"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "../README.md"

[features]
default = ["std", "derive"]
std = []
derive = ["dep:nextjson-derive"]
# Opt-in SIMD acceleration (SSE2/AVX2 on x86-64, NEON on aarch64) for the
# JSON string-scanning hot paths. The unsafe code is confined to the `scan`
# module and gated behind this feature; default builds remain 100% safe
# (`#![deny(unsafe_code)]`) and use the portable register-width fallback.
simd = []

[dependencies]
nextjson-derive = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "format_comparison"
harness = false
