[package]
name = "nextjson-serde-comparison"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone, out-of-workspace benchmark comparing nextjson against serde/serde_json."
default-run = "nextjson-serde-comparison"

# This crate is intentionally NOT a member of the root workspace. It exists so
# the repository can benchmark against the mature serde ecosystem without
# adding a third-party source to the workspace Cargo.lock (which the
# dependency-audit CI gate forbids). Its own Cargo.lock is independent and is
# committed for reproducible `--locked` builds. The empty `[workspace]` table
# declares this directory its own workspace root, excluding it from the parent
# workspace.
#
# NOTE: Cargo.lock records the *actual* version of the `nextjson` path
# dependency. Whenever the workspace bumps the nextjson version, regenerate
# this lock (`cargo update` in this directory) and commit it, or the
# benchmark-compile CI gate (`cargo build --release --locked`) will fail with
# "cannot update the lock file".
[workspace]

[dependencies]
nextjson = { path = "../../nextjson", version = "0.1.4", features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.1"
serde_yaml = "0.9"
simd-json = { version = "0.14", features = ["serde"] }
toml = "0.8"
ron = "0.8"
rmp-serde = "1"
ciborium = "0.2"
postcard = { version = "1", features = ["use-std"] }
bincode = "1"
bson = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
