name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Dependency gate: the lockfile must never reference a third-party source.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Reject external lockfile sources
        shell: bash
        run: |
          if grep -q '^source =' Cargo.lock; then
            echo 'Cargo.lock contains an external package source'
            exit 1
          fi
          cargo tree --workspace --all-features --edges normal,build,dev --locked

  # ---------------------------------------------------------------------------
  # Formatting gate: fails the pipeline on any rustfmt drift.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Coverage gate: the test suite must reach at least 80% line coverage.
  # cargo-llvm-cov is installed as a standalone binary; it never touches the
  # project Cargo.lock, so the zero-dependency dependency-audit stays valid.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (lines >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable with llvm-tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.6.16 --locked
      - name: Run tests with coverage gate
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80

  # ---------------------------------------------------------------------------
  # Lint gate: clippy with warnings denied, for the full feature set, the bare
  # no_std configuration, and no_std + derive.
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            args: --workspace --all-targets --all-features
          - name: no-default-features
            args: -p nextjson --no-default-features
          - name: no-std-derive
            args: -p nextjson --no-default-features --features derive
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Run clippy
        run: cargo clippy ${{ matrix.args }} --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Test gate: full test suite on stable and MSRV (rust-version = 1.78) across
  # all three hosted OS families, plus the no_std unit suite and a release
  # build.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, 1.78.0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Run all tests
        run: cargo +${{ matrix.rust }} test --workspace --all-features --locked
      - name: Run no_std library tests
        run: cargo +${{ matrix.rust }} test -p nextjson --no-default-features --lib --locked
      - name: Run no_std plus derive library tests
        run: cargo +${{ matrix.rust }} test -p nextjson --no-default-features --features derive --lib --locked
      - name: Build release
        run: cargo +${{ matrix.rust }} build --release --workspace --locked

  # ---------------------------------------------------------------------------
  # Docs gate: rustdoc warnings (including missing_docs) are errors; also
  # reproduce the docs.rs build to catch cfg(docsrs) issues early.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Reproduce docs.rs build for nextjson
        run: cargo rustdoc -p nextjson --all-features --locked -- --cfg docsrs -D warnings
      - name: Reproduce docs.rs build for nextjson-derive
        run: cargo rustdoc -p nextjson-derive --locked -- --cfg docsrs -D warnings

  # ---------------------------------------------------------------------------
  # Package gate: verify both crates package cleanly for crates.io (offline,
  # using the local derive crate for the core crate).
  # ---------------------------------------------------------------------------
  package:
    name: crates.io package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Verify derive crate package
        run: cargo package -p nextjson-derive --locked --offline
      - name: Verify core crate package with the unpublished local derive crate
        run: cargo package -p nextjson --locked --offline --config "patch.crates-io.nextjson-derive.path='nextjson-derive'"

  # ---------------------------------------------------------------------------
  # Benchmark gate: compile the in-workspace all-format benchmark AND the
  # standalone serde-comparison benchmark. The serde comparison lives in an
  # out-of-workspace crate (`benchmarks/serde-comparison`) with its own
  # Cargo.lock so the workspace dependency-audit (zero third-party sources)
  # stays intact; CI builds it but does not enforce a throughput threshold on
  # shared hardware.
  # ---------------------------------------------------------------------------
  benchmark:
    name: benchmark compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Compile in-workspace format benchmark
        run: cargo bench -p nextjson --bench format_comparison --no-run --locked
      - name: Compile serde comparison benchmark (out-of-workspace)
        working-directory: benchmarks/serde-comparison
        run: cargo build --release --locked
