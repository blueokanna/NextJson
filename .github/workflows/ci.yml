name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Reject external lockfile sources
        shell: bash
        run: |
          if grep -q '^source =' Cargo.lock; then
            echo 'Cargo.lock contains an external package source'
            exit 1
          fi
          cargo tree --workspace --all-features --edges normal,build,dev

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            args: --workspace --all-targets --all-features
          - name: no-default-features
            args: -p nextjson --no-default-features
          - name: no-std-derive
            args: -p nextjson --no-default-features --features derive
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Run clippy
        run: cargo clippy ${{ matrix.args }} --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, 1.71.0]
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Run all tests
        run: cargo +${{ matrix.rust }} test --workspace --all-features --locked
      - name: Run no_std library tests
        run: cargo +${{ matrix.rust }} test -p nextjson --no-default-features --lib --locked
      - name: Build release
        run: cargo +${{ matrix.rust }} build --release --workspace --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Reproduce docs.rs build for nextjson
        run: cargo rustdoc -p nextjson --all-features --locked -- --cfg docsrs -D warnings
      - name: Reproduce docs.rs build for nextjson-derive
        run: cargo rustdoc -p nextjson-derive --locked -- --cfg docsrs -D warnings

  package:
    name: crates.io package verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Verify derive crate package
        run: cargo package -p nextjson-derive --locked --offline
      - name: Verify core crate package with the unpublished local derive crate
        run: cargo package -p nextjson --locked --offline --config "patch.crates-io.nextjson-derive.path='nextjson-derive'"

  benchmark:
    name: benchmark compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision without external actions
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64)
          git init .
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Compile benchmark
        run: cargo bench -p nextjson --bench format_comparison --no-run --locked
