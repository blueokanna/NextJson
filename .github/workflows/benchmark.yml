name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nextjson/**"
      - "nextjson-derive/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "nextjson/**"
      - "nextjson-derive/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  schedule:
    # Weekly refresh of the committed report.
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTJSON_BENCH_MS: "2000"

jobs:
  benchmark:
    name: run benchmarks and generate report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Validate library and report parser before timing
        run: |
          cargo check --workspace --all-features --locked
          mkdir -p target
          rustc --edition=2021 --test benchmarks/serde-comparison/src/bin/bench_report.rs -o target/report-tests
          target/report-tests

      - name: Run in-workspace all-format benchmark (with simd)
        run: |
          mkdir -p benchmarks/results
          cargo bench -p nextjson --bench format_comparison --features simd --locked \
            > benchmarks/results/format_comparison.csv
          cat benchmarks/results/format_comparison.csv

      - name: Run serde ecosystem comparison (with simd)
        working-directory: benchmarks/serde-comparison
        run: |
          cargo run --release --locked > ../results/serde_comparison.csv
          cat ../results/serde_comparison.csv

      - name: Generate Github_Action_Benchmark.md
        run: |
          rustc --edition=2021 -O benchmarks/serde-comparison/src/bin/bench_report.rs -o target/bench-report
          target/bench-report \
            --format-csv benchmarks/results/format_comparison.csv \
            --serde-csv benchmarks/results/serde_comparison.csv \
            --out benchmarks/results/Github_Action_Benchmark.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.csv
            benchmarks/results/Github_Action_Benchmark.md
          if-no-files-found: error

      - name: Commit benchmark report (main / manual / schedule only)
        if: >-
          github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/
          if git diff --cached --quiet; then
            echo "No benchmark result changes; nothing to commit."
          else
            git commit -m "chore(benchmark): refresh Github_Action_Benchmark.md"
            git push
          fi
