[workspace]
members = ["nextjson", "nextjson-derive"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["blueokanna"]
license = "Apache-2.0"
repository = "https://github.com/blueokanna/NextJson"
rust-version = "1.78"
description = "A dependency-free, no_std data-contract engine: schema-first, multi-format, reuse-first JSON/CBOR and 16 wire formats."

[workspace.dependencies]
nextjson = { path = "nextjson", version = "0.1.4" }
nextjson-derive = { path = "nextjson-derive", version = "0.1.4" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
